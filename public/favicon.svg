<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Interactive Global Environmental Explorer">
  <title>Interactive Global Environmental Explorer</title>
  <defs>
    <clipPath id="globe-clip">
      <circle cx="32" cy="32" r="24" />
    </clipPath>
  </defs>

  <!-- Outer dark navy badge -->
  <rect width="64" height="64" rx="14" fill="#0b1220" />

  <!-- Globe ocean base -->
  <circle cx="32" cy="32" r="24" fill="#0f1b2e" />

  <!-- Clipped geographic graticules & landmass silhouettes -->
  <g clip-path="url(#globe-clip)">
    <!-- Latitude & equator lines -->
    <line x1="8" y1="32" x2="56" y2="32" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.32" />
    <ellipse cx="32" cy="22" rx="22" ry="5" fill="none" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.24" />
    <ellipse cx="32" cy="42" rx="22" ry="5" fill="none" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.24" />
    <!-- Longitude meridian -->
    <ellipse cx="32" cy="32" rx="11" ry="24" fill="none" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.28" />

    <!-- Stylized Southeast Asian / Sundaland & archipelago landmass silhouettes -->
    <path d="M16 14 C21 12, 28 14, 31 19 C33 23, 29 27, 25 26 C21 25, 17 21, 16 14 Z" fill="#34d399" fill-opacity="0.92" />
    <path d="M24 29 C27 29, 32 33, 35 38 C34 40, 30 39, 27 36 C25 34, 23 31, 24 29 Z" fill="#34d399" />
    <path d="M36 31 C40 29, 45 31, 46 35 C45 39, 40 40, 37 37 C35 35, 35 32, 36 31 Z" fill="#34d399" fill-opacity="0.92" />
    <path d="M32 42 C38 41, 46 42, 50 45 C48 48, 41 47, 34 45 C31 44, 31 42, 32 42 Z" fill="#34d399" fill-opacity="0.88" />
    <path d="M47 22 C50 21, 53 24, 52 28 C49 29, 46 26, 47 22 Z" fill="#34d399" fill-opacity="0.85" />
  </g>

  <!-- Subtle atmospheric rim -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#38bdf8" stroke-width="2" />

  <!-- Telemetry orbital arc -->
  <path d="M10 44 A28 12 -22 0 0 54 20" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="3 2.5" stroke-opacity="0.7" />

  <!-- Subtle amber environmental story node (Sumatra / Sundaland anchor) -->
  <circle cx="29" cy="34" r="5" fill="#f59e0b" fill-opacity="0.28" />
  <circle cx="29" cy="34" r="2.4" fill="#f59e0b" />
</svg>
